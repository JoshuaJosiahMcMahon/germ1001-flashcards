<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GERM1001 Flashcards</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2324505A'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial' font-size='24' font-weight='700' fill='white'%3EAa%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Flashcard controls">
        <div class="brand-block">
          <div class="mark" aria-hidden="true">Aa</div>
          <div>
            <h1>GERM1001</h1>
            <p>Midsemester flashcards</p>
          </div>
        </div>

        <section class="control-section">
          <label for="deckSelect">Deck</label>
          <select id="deckSelect"></select>
        </section>

        <section class="control-section">
          <label for="searchInput">Search cards</label>
          <input id="searchInput" type="search" placeholder="Search selected deck, e.g. Familie" />
        </section>

        <section class="stats-grid" aria-label="Progress">
          <div>
            <span id="cardCount">0</span>
            <small>cards</small>
          </div>
          <div>
            <span id="knownCount">0</span>
            <small>known</small>
          </div>
          <div>
            <span id="reviewCount">0</span>
            <small>review</small>
          </div>
        </section>

        <section class="button-grid" aria-label="Deck actions">
          <button id="shuffleBtn" type="button">Shuffle</button>
          <button id="resetBtn" type="button">Reset</button>
        </section>

        <section class="keyboard-help">
          <h2>Keys</h2>
          <p><kbd>Space</kbd> flip</p>
          <p><kbd>←</kbd> previous</p>
          <p><kbd>→</kbd> next</p>
          <p><kbd>K</kbd> known</p>
          <p><kbd>R</kbd> review</p>
        </section>
      </aside>

      <section class="study-area">
        <header class="study-header">
          <div>
            <p class="eyebrow" id="activeDeckLabel">All decks</p>
            <h2 id="cardTitle">Flashcards</h2>
          </div>
          <div class="mode-toggle" aria-label="Study direction">
            <button id="deToEnBtn" class="active" type="button">DE → EN</button>
            <button id="enToDeBtn" type="button">EN → DE</button>
          </div>
        </header>

        <div class="progress-track" aria-hidden="true">
          <div id="progressBar"></div>
        </div>

        <button id="flashcard" class="flashcard" type="button" aria-live="polite">
          <div class="card-meta">
            <span id="cardCategory">Category</span>
            <span id="cardIndex">1 / 1</span>
          </div>
          <div class="card-face">
            <p id="faceLabel">German</p>
            <div id="cardFront" class="card-main">Guten Tag</div>
            <div id="cardHint" class="card-hint">Tap or press Space to flip.</div>
          </div>
        </button>

        <div class="action-row">
          <button id="prevBtn" type="button">Previous</button>
          <button id="flipBtn" type="button">Flip</button>
          <button id="nextBtn" type="button">Next</button>
        </div>

        <div class="action-row secondary">
          <button id="knownBtn" type="button">Mark Known</button>
          <button id="reviewBtn" type="button">Mark Review</button>
        </div>

        <section class="detail-panel">
          <h3>Card Notes</h3>
          <p id="cardNotes">Select a card to begin.</p>
        </section>

        <section class="list-panel">
          <div class="list-header">
            <h3>Current Deck</h3>
            <span id="listSummary"></span>
          </div>
          <div id="cardList" class="card-list"></div>
        </section>
      </section>
    </main>

    <script src="document-cards.js"></script>
    <script src="app.js"></script>
  </body>
</html>
